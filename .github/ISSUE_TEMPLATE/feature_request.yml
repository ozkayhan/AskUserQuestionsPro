name: Feature request
description: Suggest a focused improvement to the local question experience.
title: "feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user workflow is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful behavior and affected host(s).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: constraints
    attributes:
      label: Compatibility checklist
      options:
        - label: This can remain localhost-only and single-user.
        - label: This does not require a production dependency or remote service.
        - label: This preserves existing MCP tool names and answer value types.
