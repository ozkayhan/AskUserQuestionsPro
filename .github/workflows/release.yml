name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-gate:
    name: Release Gate
    if: ${{ github.ref == 'refs/heads/main' && github.sha == github.event.after }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      statuses: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Assert exact main SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - run: npm i -g npm@11.5.1
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high --omit=dev
      - run: npm pack --dry-run --json
      - name: Shellcheck
        run: find . -name '*.sh' -not -path './node_modules/*' -not -path './.git/*' -print0 | xargs -0 shellcheck --severity=warning

      - name: Publish exact-SHA Release Gate status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$GATE_STATE" -f context='Release Gate' -f description='Exact main SHA release checks'

  release:
    name: Publish
    needs: release-gate
    if: ${{ needs.release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm i -g npm@11.5.1
      - run: npm ci
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v1
        id: changesets
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified shell installer assets
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v${VERSION}"
          ARCHIVE_BASENAME="AskUserQuestionsPro-${VERSION}"
          git archive --format=tar.gz --prefix="${ARCHIVE_BASENAME}/" \
            --output="${ARCHIVE_BASENAME}.tar.gz" "$GITHUB_SHA"
          git archive --format=zip --prefix="${ARCHIVE_BASENAME}/" \
            --output="${ARCHIVE_BASENAME}.zip" "$GITHUB_SHA"
          sha256sum "${ARCHIVE_BASENAME}.tar.gz" "${ARCHIVE_BASENAME}.zip" \
            install.sh uninstall.sh > "${ARCHIVE_BASENAME}.sha256"
          gh release upload "$RELEASE_TAG" \
            "${ARCHIVE_BASENAME}.tar.gz" \
            "${ARCHIVE_BASENAME}.zip" \
            "${ARCHIVE_BASENAME}.sha256" \
            --clobber
