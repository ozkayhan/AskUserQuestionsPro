name: Publish to npm

# main'e her push (PR merge dahil) → package.json sürümü npm'dekinden yeniyse yayınla.
# Sürüm aynıysa hiçbir şey yapmaz, hata vermez. Sürüm bump'ı package.json'da elle yapılır.
on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance için
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - run: npm install

      - run: npm test

      - name: Sürüm npm'de yok mu kontrol et
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # Sadece E404 (sürüm yok) yayını tetikler. Ağ/registry hatasında işi durdur —
          # aksi halde geçici hiccup'ta zaten yayında olan sürüm tekrar publish edilmeye çalışılır.
          if OUTPUT=$(npm view "$NAME@$VERSION" version 2>&1); then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "ℹ️  $NAME@$VERSION zaten yayında — atlanıyor."
          elif echo "$OUTPUT" | grep -q 'E404'; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "🚀 $NAME@$VERSION yayınlanacak."
          else
            echo "❌ npm view beklenmeyen hata verdi (registry/ağ sorunu olabilir), publish atlanıyor:"
            echo "$OUTPUT"
            exit 1
          fi

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
